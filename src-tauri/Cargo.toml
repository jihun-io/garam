[package]
name = "garam"
description = "Garam, a friendly cross-platform Git client"
authors = ["Garam contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "garam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Named after the product so unbundled dev builds show "Garam" in the Dock
# and task switcher, matching the bundled app.
name = "Garam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
garam-git = { workspace = true, features = ["specta"] }
garam-github.workspace = true
getrandom = { version = "0.3", features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
notify-debouncer-full = "0.7"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
trash = "5"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
