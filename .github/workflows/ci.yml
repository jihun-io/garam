name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          run_ci=false

          while IFS= read -r -d '' file; do
            case "$file" in
              *.md | *.mdx | docs/* | LICENSE | LICENSE.*) ;;
              *)
                run_ci=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip checks for documentation-only changes
        if: needs.changes.outputs.run_ci != 'true'
        run: echo "Only documentation files changed."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_ci == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.run_ci == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_ci == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.run_ci == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.run_ci == 'true'
      - run: pnpm lint
        if: needs.changes.outputs.run_ci == 'true'
      - run: pnpm format:check
        if: needs.changes.outputs.run_ci == 'true'
      - run: pnpm i18n:check
        if: needs.changes.outputs.run_ci == 'true'
      - run: pnpm test
        if: needs.changes.outputs.run_ci == 'true'
      # Pull requests skip the full Tauri build below, so check the
      # production bundle here; it's the same on every OS.
      - run: pnpm exec vite build
        if: needs.changes.outputs.run_ci == 'true'

  rust:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # A Windows run without a Rust cache takes about 30 minutes.
    timeout-minutes: 45
    steps:
      - name: Skip checks for documentation-only changes
        if: needs.changes.outputs.run_ci != 'true'
        run: echo "Only documentation files changed."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_ci == 'true'
      # Cached because the runner's apt mirror sometimes takes many minutes.
      - name: Install Linux system dependencies
        if: needs.changes.outputs.run_ci == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
          version: 1
      - name: Install Rust toolchain (from rust-toolchain.toml)
        if: needs.changes.outputs.run_ci == 'true'
        run: rustup toolchain install
      # Pull requests restore main's cache but don't save their own: a saved
      # cache holds only dependencies, so it would match main's and push it
      # out of the repository's 10 GB cache limit. The release workflow
      # restores this cache too, through the shared key.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.run_ci == 'true'
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.run_ci == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_ci == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.run_ci == 'true'
      - run: cargo fmt --all --check
        if: needs.changes.outputs.run_ci == 'true'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: needs.changes.outputs.run_ci == 'true'
      - run: cargo test --workspace
        if: needs.changes.outputs.run_ci == 'true'
      - name: Check generated TypeScript bindings are up to date
        if: needs.changes.outputs.run_ci == 'true' && runner.os == 'Linux'
        run: git diff --exit-code -- src/ipc/bindings.ts
      # The LTO release build takes 3 to 6 minutes and no cache shortens it,
      # so it runs on main only, to catch a broken build before a release tag.
      - name: Build app (no installer)
        if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'push'
        run: pnpm tauri build --no-bundle
