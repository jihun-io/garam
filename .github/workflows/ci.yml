name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test
      # Pull requests skip the full Tauri build below, so check the
      # production bundle here; it's the same on every OS.
      - run: pnpm exec vite build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # A Windows run without a Rust cache takes about 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Cached because the runner's apt mirror sometimes takes many minutes.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
          version: 1
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      # Pull requests restore main's cache but don't save their own: a saved
      # cache holds only dependencies, so it would match main's and push it
      # out of the repository's 10 GB cache limit. The release workflow
      # restores this cache too, through the shared key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Check generated TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/ipc/bindings.ts
      # The LTO release build takes 3 to 6 minutes and no cache shortens it,
      # so it runs on main only, to catch a broken build before a release tag.
      - name: Build app (no installer)
        if: github.event_name == 'push'
        run: pnpm tauri build --no-bundle
